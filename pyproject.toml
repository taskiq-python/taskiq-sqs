[project]
name = "taskiq-sqs"
version = "0.0.11"
description = "SQS Broker for TaskIQ"
urls = {source = "https://github.com/taskiq-python/taskiq-sqs"}
readme = "README.md"
licence = "MIT"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = ["taskiq", "broker", "aws", "sqs"]
requires-python = ">=3.10"
dependencies = [
    "taskiq>=0.12.1",
    "asyncer~=0.0.5",
    "boto3~=1.34.34",
    "aiobotocore>=2.13.3",
]

# [project.urls]
# "Bug Tracker" = "https://github.com/taskiq-python/taskiq-sqs/issues"
# "Repository" = "https://github.com/taskiq-python/taskiq-sqs/"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "types"},
    "prek>=0.4.3",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.8",
]
lint = [
    "bandit>=1.9.4",
    "ruff>=0.15.15",
    "zizmor>=1.25.2",
]
types = [
    "mypy>=2.1.0",
    "mypy-boto3-sqs>=1.34.101",
    "boto3-stubs[essential]>=1.34.84",
    "types-aiobotocore[essential]>=3.7.0",
]
examples = [
    "python-dotenv>=1.2.2",
]


[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskiq_sqs"

[tool.mypy]
exclude = "build/"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
markers = [
    "unit: marks unit tests",
    "integration: marks tests with real infrastructure env",
]

[tool.coverage.report]
exclude_lines = [
    "# pragma: no cover",
    "def __repr__",
    "def __str__",
    "def __unicode__",
    "if tp.TYPE_CHECKING:",
]
show_missing = true
skip_empty = true
omit = [
    "*/__init__.py",
    "venv/*",
    "tests/*"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # TODO: enable this rules
    "TRY301",
    "ANN401",
    "FIX002",
    "TD002",
    "TD003",

    # boolean args
    "FBT001",
    "FBT002",

    # Docstrings
    "D104",  # in public package
    "D100",  # in public module

    # Conflicted rules
    "D203",  # with D211
    "D212",  # with D213
    "COM812",  # with formatter

    "EM101",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "S101",  # assert usage
    "SLF001",  # private member accessed
    "PLR2004",  # magic values
]
"examples/*" = [
    "T201",  # print
    "D",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-local-folder = ["taskiq_sqs"]
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-args = 7
